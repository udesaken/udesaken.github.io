        /* Canvas Buraco Negro (roxo) */
        #universe-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            pointer-events: none;
            background: #000;

        /* Navbar Glass */
        .nav-wrapper {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }
        .nav-wrapper nav {
            max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
            background: rgba(8, 8, 8, 0.75);
            backdrop-filter: blur(30px) saturate(120%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 8px 16px;
        }
        .nav-wrapper.glass-nav nav {
            background: rgba(0, 0, 0, 0.92);
            border-color: rgba(168, 85, 247, 0.2);
        }
        
        .text-gradient {
            background: linear-gradient(160deg, #ffffff 0%, #c084fc 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .fade-up { 
            opacity: 0; 
            transform: translateY(20px); 
            transition: opacity 0.6s ease, transform 0.6s ease; 
        }
        .fade-up.active { opacity: 1; transform: translateY(0); }

        /* Cards da equipe */
        .dev-card {
            background: var(--brand-card);
            backdrop-filter: blur(28px) saturate(130%);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(.16,1,.3,1);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 340px;
            height: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.85);
            position: relative;
        }

        .dev-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 50%), rgba(168,85,247,0.12), transparent 40%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 0;
        }

        .dev-card:hover::before { opacity: 1; }

        .dev-card:hover {
            border-color: var(--border-glow-hover);
            transform: translateY(-4px);
        }

        .dev-img-wrapper {
            position: relative;
            width: 100%;
            height: 240px;
            overflow: hidden;
            z-index: 1;
            flex-shrink: 0;
        }

        .dev-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: grayscale(100%) contrast(1.1);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .dev-card:hover .dev-img-wrapper img {
            filter: grayscale(20%) contrast(1.1);
            transform: scale(1.03);
        }

        .dev-img-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to top, rgba(12,12,12,0.95) 0%, transparent 100%);

    <script>
        // ==================== CANVAS BURACO NEGRO (ROXO) ====================
        (function() {
            const canvas = document.getElementById('universe-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, particles;

            const BH = {
                get x() { return W * 0.5; },
                get y() { return H * 0.82; },
                get r() { return Math.min(W, H) * 0.10; },
                diskInner: 1.5,
                diskOuter: 3.8,
                angle: 0
            };

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                particles = [];
                const n = Math.min(Math.floor(W / 20), 80);
                for (let i = 0; i < n; i++) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                        r: Math.random() * 1 + 0.3
                    });
                }
            }

            function drawBackDisk(bx, by, R) {
                const outer = R * BH.diskOuter;
                ctx.save();
                ctx.translate(bx, by);
                const ag = ctx.createRadialGradient(0, -R*.18, R*BH.diskInner*.5, 0, 0, outer*.85);
                ag.addColorStop(0, 'rgba(168,85,247,0.45)');
                ag.addColorStop(0.4, 'rgba(140,80,240,0.25)');
                ag.addColorStop(1, 'rgba(80,30,180,0)');
                ctx.beginPath();
                ctx.ellipse(0, -R*.22, outer*.88, R*.22, 0, Math.PI, 0);
                ctx.fillStyle = ag;
                ctx.fill();
                ctx.restore();
            }

            function drawAccretionDisk(bx, by, R, angle) {
                const inner = R * BH.diskInner, outer = R * BH.diskOuter;
                ctx.save();
                ctx.translate(bx, by); ctx.rotate(angle); ctx.scale(1, 0.28);
                const g = ctx.createRadialGradient(0,0,inner,0,0,outer);
                g.addColorStop(0, 'rgba(139,92,246,0)');
                g.addColorStop(0.2, 'rgba(168,85,247,0.5)');
                g.addColorStop(0.5, 'rgba(216,180,254,0.8)');
                g.addColorStop(0.8, 'rgba(126,34,206,0.35)');
                g.addColorStop(1, 'rgba(60,20,100,0)');
                ctx.beginPath();
                ctx.arc(0,0,outer,0,Math.PI*2);
                ctx.arc(0,0,inner,Math.PI*2,0,true);
                ctx.fillStyle = g;
                ctx.fill();
                ctx.restore();
            }

            function drawBlackHole(bx, by, R) {
                const glow = ctx.createRadialGradient(bx,by,R*.6,bx,by,R*2);
                glow.addColorStop(0,'rgba(168,85,247,0.15)');
                glow.addColorStop(0.4,'rgba(100,50,200,0.08)');
                glow.addColorStop(1,'rgba(0,0,0,0)');
                ctx.beginPath(); ctx.arc(bx,by,R*2,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
                
                const sh = ctx.createRadialGradient(bx,by*.999,R*.1,bx,by,R);
                sh.addColorStop(0,'#000'); sh.addColorStop(0.85,'#000'); sh.addColorStop(1,'rgba(0,0,0,0.85)');
                ctx.beginPath(); ctx.arc(bx,by,R,0,Math.PI*2); ctx.fillStyle=sh; ctx.fill();
            }

            function gravity(p) {
                const dx=BH.x-p.x, dy=BH.y-p.y, d=Math.hypot(dx,dy);
                if (d < BH.r*5 && d > BH.r*1.2) {
                    const f=0.0001*(BH.r*5/d);
                    p.vx+=(dx/d)*f; p.vy+=(dy/d)*f;
                }
                if (d < BH.r*1.15) {
                    p.x=Math.random()*W; p.y=Math.random()*H*.6;
                    p.vx=(Math.random()-.5)*.3; p.vy=(Math.random()-.5)*.3;
                }
            }

            let t = 0;
            function draw() {
                ctx.clearRect(0,0,W,H);
                t += 16; BH.angle = t * 0.00015;
                drawBackDisk(BH.x,BH.y,BH.r);
                drawAccretionDisk(BH.x,BH.y,BH.r,BH.angle);
                drawBlackHole(BH.x,BH.y,BH.r);
                ctx.fillStyle='rgba(230,210,255,0.6)';
                for (let i=0; i<particles.length; i++) {
                    const p=particles[i];
                    gravity(p); p.x+=p.vx; p.y+=p.vy;
                    if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
                    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
                }
                requestAnimationFrame(draw);
            }

            resize(); window.addEventListener('resize', resize); draw();
        })();

        const iconMap = {

        if (gridContainer) {

            teamMembers.forEach(member => {

                if (member.additionalRoles && member.additionalRoles.length > 0) {

                const skillsHtml = member.skills.map(skill => `<span class="skill-pill">${skill}</span>`).join('');

                gridContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // ==================== ANIMAÇÃO FADE-UP ====================
        const fadeElements = document.querySelectorAll('.fade-up');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });
        fadeElements.forEach(el => observer.observe(el));
        
        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>
