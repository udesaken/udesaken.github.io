<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Conheça a equipe oficial da Udesaken Group. Os administradores que fazem o ecossistema funcionar.">
    <meta name="theme-color" content="#000000">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Equipe Oficial | Udesaken Group">
    <meta property="og:description" content="Conheça a equipe oficial da Udesaken Group. Os administradores que fazem o ecossistema funcionar.">
    <meta property="og:image" content="https://udesaken.site/logousk.png">
    <title>Equipe Oficial | Udesaken Group</title>
    
    <!-- Fontes da Marca Udesaken -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Space Grotesk', 'sans-serif'],
                        syne: ['Syne', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            accent: '#ff8c00', // Laranja Udesaken
                            card: 'rgba(12, 12, 12, 0.62)',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --bg-deep: #000000;
            --border-glow: rgba(255, 255, 255, 0.07);
            --border-glow-hover: rgba(255, 140, 0, 0.3);
            --text-primary: #ffffff;
            --accent: #ff8c00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #000000; 
            color: var(--text-primary); 
            font-family: 'Space Grotesk', sans-serif; 
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* Canvas Buraco Negro */
        #universe-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            pointer-events: none;
            background: #000;
        }

        /* Navbar Glass (Estilo Home) */
        .nav-wrapper {
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }
        .nav-wrapper nav {
            max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
            background: rgba(8, 8, 8, 0.75);
            backdrop-filter: blur(30px) saturate(120%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 8px 16px;
        }
        .nav-wrapper.glass-nav nav {
            background: rgba(0, 0, 0, 0.92);
            border-color: rgba(255,255,255,0.13);
        }
        
        /* Textos e Animações */
        .text-gradient {
            background: linear-gradient(160deg, #ffffff 0%, #777777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .fade-up { 
            opacity: 0; 
            transform: translateY(20px); 
            transition: opacity 0.6s ease, transform 0.6s ease; 
        }
        .fade-up.active { opacity: 1; transform: translateY(0); }

        /* ================= CARDS DA EQUIPE (Glass + Print Style) ================= */
        .dev-card {
            background: var(--brand-card);
            backdrop-filter: blur(28px) saturate(130%);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(.16,1,.3,1);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 340px;
            height: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.85);
            position: relative;
        }

        .dev-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.055), transparent 40%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 0;
        }

        .dev-card:hover::before { opacity: 1; }

        .dev-card:hover {
            border-color: var(--border-glow-hover);
            transform: translateY(-4px);
        }

        .dev-img-wrapper {
            position: relative;
            width: 100%;
            height: 240px;
            overflow: hidden;
            z-index: 1;
            flex-shrink: 0;
        }

        .dev-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: grayscale(100%) contrast(1.1);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .dev-card:hover .dev-img-wrapper img {
            filter: grayscale(20%) contrast(1.1);
            transform: scale(1.03);
        }

        .dev-img-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to top, rgba(12,12,12,0.95) 0%, transparent 100%);
        }

        .dev-content {
            padding: 0 24px 24px 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            z-index: 1;
        }

        .skill-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #9ca3af;
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #6b7280;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .dev-card:hover .icon-box:hover {
            color: var(--accent);
            background: rgba(255, 140, 0, 0.1);
            border-color: rgba(255, 140, 0, 0.3);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; background: #000; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #2a1a00; border-radius: 3px; }
        ::selection { background: rgba(255,140,0,0.2); color: #fff; }
    </style>
    <link rel="icon" type="image/png" href="../logousk.png">
</head>
<body>

    <canvas id="universe-canvas"></canvas>

    <div class="nav-wrapper transition-all duration-300" id="navbar">
        <nav>
            <a href="/" class="flex items-center gap-3 group text-white no-underline">
                <div class="w-7 h-7 rounded-lg border border-white/10 overflow-hidden bg-black flex items-center justify-center">
                    <img src="../logousk1.png" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/36x36'">
                </div>
                <span class="font-syne font-extrabold tracking-tight text-base">Udesaken</span>
            </a>
            <div class="hidden md:flex items-center gap-4">
                <a href="/" class="text-gray-400 hover:text-white text-sm font-medium transition flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-white/5"><i class="fas fa-arrow-left text-xs"></i> Início</a>
            </div>
            <div class="flex md:hidden gap-3">
                <a href="/" class="px-4 py-2 bg-white/5 text-white rounded-lg text-xs font-bold border border-white/10"><i class="fas fa-arrow-left"></i></a>
            </div>
        </nav>
    </div>

    <main class="relative z-10 pt-32 pb-20">
        <section class="text-center relative">
            <div class="max-w-4xl mx-auto px-6 fade-up">
                <div class="inline-flex items-center gap-2 mb-6 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 backdrop-blur-md">
                    <span class="w-1.5 h-1.5 rounded-full bg-brand-accent shadow-[0_0_8px_#ff8c00] animate-pulse"></span>
                    <span class="text-[10px] font-bold text-white/70 tracking-[0.15em] uppercase">Staff Oficial</span>
                </div>
                <h1 class="font-syne text-5xl md:text-7xl font-extrabold text-white mb-5 tracking-tighter leading-[1.1]">
                    Quem Faz <span class="text-gradient">Acontecer</span>
                </h1>
                <p class="text-[0.95rem] text-gray-400 max-w-xl mx-auto font-medium leading-relaxed">
                    As mentes por trás do ecossistema Udesaken. Focados em entregar segurança blindada e alta performance.
                </p>
            </div>
        </section>

        <section class="py-16 relative">
            <div class="max-w-[1400px] mx-auto px-6 fade-up">
                <div id="team-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 justify-items-center items-stretch">
                    <!-- Os cards são injetados aqui -->
                </div>
            </div>
        </section>
    </main>

    <footer class="pt-12 pb-8 border-t border-white/5 bg-gradient-to-b from-transparent to-black/90 backdrop-blur-sm relative z-10 mt-5">
        <div class="max-w-[1100px] mx-auto px-6 text-center">
            <div class="flex justify-center gap-8 mb-6">
                <a href="/" class="text-gray-500 hover:text-white transition text-xs font-semibold">Início</a>
                <a href="../planos/" class="text-gray-500 hover:text-white transition text-xs font-semibold">Planos</a>
                <a href="../termos/" class="text-gray-500 hover:text-white transition text-xs font-semibold">Termos</a>
            </div>
            <div class="h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent my-6"></div>
            <p class="text-[0.7rem] text-gray-500 font-bold tracking-[0.12em] uppercase">Udesaken Group &copy; 2026 • Todos os direitos reservados</p>
        </div>
    </footer>

    <script>
        // ==================== CANVAS BURACO NEGRO ====================
        (function() {
            const canvas = document.getElementById('universe-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, particles;

            const BH = {
                get x() { return W * 0.5; },
                get y() { return H * 0.82; },
                get r() { return Math.min(W, H) * 0.10; },
                diskInner: 1.5,
                diskOuter: 3.8,
                angle: 0
            };

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                particles = [];
                const n = Math.min(Math.floor(W / 20), 80);
                for (let i = 0; i < n; i++) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                        r: Math.random() * 1 + 0.3
                    });
                }
            }

            function drawBackDisk(bx, by, R) {
                const outer = R * BH.diskOuter;
                ctx.save();
                ctx.translate(bx, by);
                const ag = ctx.createRadialGradient(0, -R*.18, R*BH.diskInner*.5, 0, 0, outer*.85);
                ag.addColorStop(0, 'rgba(255,220,100,0.4)');
                ag.addColorStop(0.4, 'rgba(255,140,20,0.2)');
                ag.addColorStop(1, 'rgba(200,60,0,0)');
                ctx.beginPath();
                ctx.ellipse(0, -R*.22, outer*.88, R*.22, 0, Math.PI, 0);
                ctx.fillStyle = ag;
                ctx.fill();
                ctx.restore();
            }

            function drawAccretionDisk(bx, by, R, angle) {
                const inner = R * BH.diskInner, outer = R * BH.diskOuter;
                ctx.save();
                ctx.translate(bx, by); ctx.rotate(angle); ctx.scale(1, 0.28);
                const g = ctx.createRadialGradient(0,0,inner,0,0,outer);
                g.addColorStop(0, 'rgba(255,140,0,0)');
                g.addColorStop(0.2, 'rgba(255,200,80,0.4)');
                g.addColorStop(0.5, 'rgba(255,255,220,0.7)');
                g.addColorStop(0.8, 'rgba(200,60,0,0.3)');
                g.addColorStop(1, 'rgba(100,20,0,0)');
                ctx.beginPath();
                ctx.arc(0,0,outer,0,Math.PI*2);
                ctx.arc(0,0,inner,Math.PI*2,0,true);
                ctx.fillStyle = g;
                ctx.fill();
                ctx.restore();
            }

            function drawBlackHole(bx, by, R) {
                const glow = ctx.createRadialGradient(bx,by,R*.6,bx,by,R*2);
                glow.addColorStop(0,'rgba(255,120,0,0.12)');
                glow.addColorStop(0.4,'rgba(180,60,0,0.05)');
                glow.addColorStop(1,'rgba(0,0,0,0)');
                ctx.beginPath(); ctx.arc(bx,by,R*2,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
                
                const sh = ctx.createRadialGradient(bx,by*.999,R*.1,bx,by,R);
                sh.addColorStop(0,'#000'); sh.addColorStop(0.85,'#000'); sh.addColorStop(1,'rgba(0,0,0,0.85)');
                ctx.beginPath(); ctx.arc(bx,by,R,0,Math.PI*2); ctx.fillStyle=sh; ctx.fill();
            }

            function gravity(p) {
                const dx=BH.x-p.x, dy=BH.y-p.y, d=Math.hypot(dx,dy);
                if (d < BH.r*5 && d > BH.r*1.2) {
                    const f=0.0001*(BH.r*5/d);
                    p.vx+=(dx/d)*f; p.vy+=(dy/d)*f;
                }
                if (d < BH.r*1.15) {
                    p.x=Math.random()*W; p.y=Math.random()*H*.6;
                    p.vx=(Math.random()-.5)*.3; p.vy=(Math.random()-.5)*.3;
                }
            }

            let t = 0;
            function draw() {
                ctx.clearRect(0,0,W,H);
                t += 16; BH.angle = t * 0.00015;
                drawBackDisk(BH.x,BH.y,BH.r);
                drawAccretionDisk(BH.x,BH.y,BH.r,BH.angle);
                drawBlackHole(BH.x,BH.y,BH.r);
                ctx.fillStyle='rgba(255,255,255,0.5)';
                for (let i=0; i<particles.length; i++) {
                    const p=particles[i];
                    gravity(p); p.x+=p.vx; p.y+=p.vy;
                    if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
                    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
                }
                requestAnimationFrame(draw);
            }

            resize(); window.addEventListener('resize', resize); draw();
        })();

        // ==================== NAVBAR SCROLL ====================
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if(window.scrollY > 20) navbar.classList.add('glass-nav');
            else navbar.classList.remove('glass-nav');
        });

        // ==================== EFEITO GLASS MOUSEMOVE ====================
        document.addEventListener('mousemove', (e) => {
            document.querySelectorAll('.dev-card').forEach(el => {
                const r = el.getBoundingClientRect();
                el.style.setProperty('--mx', `${e.clientX - r.left}px`);
                el.style.setProperty('--my', `${e.clientY - r.top}px`);
            });
        });

        // ==================== DADOS DA EQUIPE ====================
        const profilesData = {
            isloch: {
                id: "isloch",
                name: "Isloch",
                role: "Founder, CEO & Dev",
                fullDescription: "Criador e desenvolvedor focado em JavaScript e Python. Supervisiona todo o ecossistema da Udesaken.",
                image: "../islo.jpg",
                skills: ["JavaScript", "Python", "Node.js", "Arquitetura"],
                socials: [
                    { name: 'instagram', url: 'https://instagram.com/isloch_' },
                    { name: 'tiktok', url: 'https://tiktok.com/@isloch_' }
                ]
            },
            hyuuzaki: {
                id: "hyuuzaki",
                name: "Hyuuzaki",
                role: "Head Manager",
                fullDescription: "Cuida da nossa staff e é responsável por criar as figurinhas exclusivas para o canal.",
                image: "../hyuuzaki.jpg",
                skills: ["Gestão", "Design", "Estratégia", "Stickers"],
                socials: []
            },
            psax: {
                id: "psax",
                name: "PsaX",
                role: "Admin Geral",
                fullDescription: "Trabalha diretamente na organização e bem-estar de toda a equipe.",
                image: "../pisa.jpg",
                skills: ["Coordenação", "Liderança", "Operações"],
                socials: []
            },
            mz: {
                id: "mz",
                name: "Mz",
                role: "Admin Channel",
                fullDescription: "Foca na criação de figurinhas em parceria com a gestão e mantém nossos canais ativos.",
                image: "../mz.jpg",
                skills: ["Conteúdo", "Mídia", "Comunicação"],
                socials: []
            },
            kamys: {
                id: "kamys",
                name: "Kamys",
                role: "Administradora",
                fullDescription: "Sempre atenta para auxiliar em tudo que a comunidade precisa para crescer de forma organizada.",
                image: "../kamys.jpg",
                skills: ["Suporte", "Moderação", "Empatia"],
                socials: []
            },
            pedim: {
                id: "pedim",
                name: "Pedim",
                role: "Administrador",
                fullDescription: "Garante que tudo flua perfeitamente no dia a dia, mantendo a ordem no grupo.",
                image: "../pedim.jpg",
                skills: ["Regras", "Moderação", "Segurança"],
                socials: []
            },
            dn: {
                id: "dn",
                name: "Dn",
                role: "Jovem Aprendiz & Mascote",
                fullDescription: "O coração fofinho da equipe, sempre presente para espalhar alegria e aprender com todos.",
                image: "../dn.jpg",
                skills: ["Carisma", "Positividade", "Aprendizado"],
                socials: []
            }
        };

        // ==================== GERAR CARDS NA TELA ====================
        const gridContainer = document.getElementById('team-grid');
        const iconMap = {
            'github': 'fab fa-github', 
            'instagram': 'fab fa-instagram',
            'envelope': 'far fa-envelope', 
            'discord': 'fab fa-discord', 
            'twitter': 'fab fa-twitter',
            'tiktok': 'fab fa-tiktok'
        };

        Object.values(profilesData).forEach(profile => {
            const skillsHtml = profile.skills.map(skill => `<span class="skill-pill">${skill}</span>`).join('');
            
            // Renderiza seção de redes sociais apenas se existirem
            const socialsHtml = profile.socials && profile.socials.length > 0 ? `
                <div class="mt-auto pt-4 border-t border-white/5">
                    <div class="flex gap-2">
                        ${profile.socials.map(social => `<a href="${social.url}" target="_blank" class="icon-box"><i class="${iconMap[social.name] || 'fas fa-link'}"></i></a>`).join('')}
                    </div>
                </div>
            ` : '<div class="mt-auto"></div>';

            const cardHtml = `
                <div class="dev-card">
                    <div class="dev-img-wrapper">
                        <img src="${profile.image}" alt="${profile.name}" onerror="this.src='https://placehold.co/400x400/121212/ffffff?text=${profile.name}'">
                        <div class="dev-img-overlay"></div>
                    </div>
                    <div class="dev-content">
                        <h2 class="font-syne text-xl font-extrabold text-white tracking-tight">${profile.name}</h2>
                        <div class="text-brand-accent text-sm font-semibold mt-1 mb-4">${profile.role}</div>
                        
                        <!-- Texto descritivo completo -->
                        <p class="text-gray-300 text-[0.85rem] leading-relaxed mb-6">
                            ${profile.fullDescription}
                        </p>

                        <div class="flex flex-wrap gap-2 mb-6">
                            ${skillsHtml}
                        </div>

                        ${socialsHtml}
                    </div>
                </div>
            `;
            gridContainer.insertAdjacentHTML('beforeend', cardHtml);
        });

        // ==================== ANIMAÇÃO FADE-UP ====================
        const fadeElements = document.querySelectorAll('.fade-up');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });
        fadeElements.forEach(el => observer.observe(el));

    </script>
</body>
</html>
