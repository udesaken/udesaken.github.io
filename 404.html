<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada | Udesaken Group</title>

    <link rel="stylesheet" href="/style.css?v=5.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        main: '#ffffff',
                        muted: '#888888',
                    },
                    letterSpacing: { tight: '-0.02em' }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }
        
        #universe-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            pointer-events: none;
            background: radial-gradient(circle at 30% 20%, #0a0a0f 0%, #000000 100%);
        }

        .text-gradient-mono {
            background: linear-gradient(180deg, #ffffff 0%, #555555 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
    <link rel="stylesheet" href="/style.css?v=6.0">
</head>
<body class="antialiased selection:bg-white/30 selection:text-white h-screen flex flex-col">

    <canvas id="universe-canvas"></canvas>

    <main class="flex-grow flex items-center justify-center p-6 relative z-10">
        <div class="max-w-lg w-full text-center fade-up">
            
            <div class="glass-panel p-10 md:p-14 rounded-[32px] shadow-2xl border border-white/10 relative overflow-hidden group">
                <div class="absolute inset-0 bg-white/5 blur-[80px] group-hover:bg-white/10 transition duration-700"></div>
                
                <h1 class="text-7xl md:text-9xl font-black text-gradient-mono mb-2 drop-shadow-lg">
                    404
                </h1>
                
                <div class="inline-flex items-center gap-2 mb-6 px-4 py-1.5 rounded-full bg-white/5 border border-white/20">
                    <i class="fas fa-satellite-dish text-white text-xs animate-pulse opacity-80"></i>
                    <span class="text-[10px] font-bold text-white/80 tracking-widest uppercase">Sinal Perdido</span>
                </div>

                <h2 class="text-2xl font-bold text-white mb-4">Página não encontrada</h2>
                <p class="text-muted text-sm md:text-base mb-10 font-medium leading-relaxed">
                    A rota que você tentou acessar não existe ou se perdeu no espaço. Verifique as coordenadas ou retorne à base.
                </p>

                <a href="/" class="inline-flex items-center justify-center gap-3 w-full py-4 bg-white/5 hover:bg-white text-white hover:text-black font-bold rounded-xl transition duration-300 border border-white/10 hover:border-white hover:shadow-[0_0_30px_rgba(255,255,255,0.3)]">
                    <i class="fas fa-home"></i> Voltar para o Início
                </a>
            </div>

        </div>
    </main>

    <script>
        // ==================== CANVAS UNIVERSO ESTRELADO ====================
        const canvas = document.getElementById('universe-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars;
        
        function initStars() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];
            const starCount = Math.min(Math.floor(window.innerWidth / 12), 120);
            for(let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    radius: Math.random() * 1.5 + 0.3,
                    alpha: Math.random() * 0.5 + 0.3
                });
            }
        }
        
        function drawStars() {
            if(!ctx) return;
            ctx.clearRect(0, 0, width, height);
            
            for(let i = 0; i < stars.length; i++) {
                let s = stars[i];
                s.x += s.vx;
                s.y += s.vy;
                
                if(s.x < 0) s.x = width;
                if(s.x > width) s.x = 0;
                if(s.y < 0) s.y = height;
                if(s.y > height) s.y = 0;
                
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * 0.7})`;
                ctx.fill();
                
                for(let j = i + 1; j < stars.length; j++) {
                    let s2 = stars[j];
                    let dist = Math.hypot(s.x - s2.x, s.y - s2.y);
                    if(dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(s2.x, s2.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.05 - dist/2000})`;
                        ctx.lineWidth = 0.4;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawStars);
        }
        
        window.addEventListener('resize', () => { initStars(); });
        initStars();
        drawStars();

        // ==================== EFEITO MOUSE GLASS PANEL ====================
        document.addEventListener('DOMContentLoaded', () => {
            const glassPanels = document.querySelectorAll('.glass-panel');
            glassPanels.forEach(panel => {
                panel.addEventListener('mousemove', (e) => {
                    const rect = panel.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    panel.style.setProperty('--mouse-x', `${x}px`);
                    panel.style.setProperty('--mouse-y', `${y}px`);
                });
            });
            
            // Ativar a animação fade-up ao carregar
            setTimeout(() => {
                document.querySelector('.fade-up').classList.add('active');
            }, 100);
        });
    </script>
</body>
</html>
