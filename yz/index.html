<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Syne:wght@400;700;800&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            min-height: 100vh;
            overflow: hidden;
        }
        /* ruído */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 9998;
            pointer-events: none;
            opacity: 0.045;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            animation: grain 0.4s steps(1) infinite;
        }
        @keyframes grain { 0% { background-position: 0 0; } 10% { background-position: -5% -10%; } 20% { background-position: -15% 5%; } 30% { background-position: 7% -25%; } 40% { background-position: -5% 25%; } 50% { background-position: -15% 10%; } 60% { background-position: 15% 0%; } 70% { background-position: 0% 15%; } 80% { background-position: 3% 35%; } 90% { background-position: -10% 10%; } }

        .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.8) 100%); }
        .scan { position: fixed; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,40,40,0.15), transparent); z-index: 6; pointer-events: none; animation: scan 10s linear infinite; }
        @keyframes scan { 0% { top: -2px; } 100% { top: 100vh; } }
        .glitch-line { position: fixed; left: 0; right: 0; height: 1px; background: rgba(255,30,30,0.05); animation: lineSlide 7s linear infinite; z-index: 5; pointer-events: none; }
        @keyframes lineSlide { 0% { top: -2px; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 0.2; } 100% { top: 100vh; opacity: 0; } }

        canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .hero {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 100%;
        }
        .title-yz {
            font-family: 'IM Fell English', serif;
            font-size: clamp(140px, 25vw, 320px);
            line-height: 0.85;
            letter-spacing: -0.02em;
            color: transparent;
            -webkit-text-stroke: 1px #ffffff;
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0% { opacity: 0.7; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
            50% { opacity: 1; text-shadow: 0 0 40px rgba(255,255,255,0.4); }
            100% { opacity: 0.7; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        }
        @media (max-width: 600px) {
            .title-yz { -webkit-text-stroke: 0.5px #ffffff; }
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="vignette"></div>
    <div class="glitch-line"></div>
    <div class="scan"></div>

    <div class="hero">
        <div class="title-yz">Yz</div>
    </div>

    <script>
        // partículas silenciosas
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let W, H, particles = [];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', () => { resize(); initParticles(); });

        function initParticles() {
            particles = [];
            const count = Math.floor((W * H) / 18000);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * W, y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.1, vy: (Math.random() - 0.5) * 0.1,
                    r: Math.random() * 1.2 + 0.2, a: Math.random() * 0.3 + 0.03,
                    flicker: Math.random() * Math.PI * 2
                });
            }
        }
        initParticles();

        let mouseX = W/2, mouseY = H/2;
        document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

        let t = 0;
        function draw() {
            ctx.clearRect(0, 0, W, H);
            t += 0.008;

            particles.forEach(p => {
                p.flicker += 0.02;
                const alpha = p.a * (0.6 + 0.4 * Math.sin(p.flicker));

                const dx = p.x - mouseX, dy = p.y - mouseY;
                const dist = Math.hypot(dx, dy);
                if (dist < 100) {
                    p.vx += (dx / dist) * 0.04;
                    p.vy += (dy / dist) * 0.04;
                }

                p.vx *= 0.99; p.vy *= 0.99;
                p.x += p.vx; p.y += p.vy;

                if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
                if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.fill();
            });

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const a = particles[i], b = particles[j];
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (d < 90) {
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(255,255,255,${0.02 * (1 - d/90)})`;
                        ctx.lineWidth = 0.3;
                        ctx.stroke();
                    }
                }
            }

            const grd = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.4);
            grd.addColorStop(0, `rgba(255,255,255,0.02)`);
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, W, H);

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
