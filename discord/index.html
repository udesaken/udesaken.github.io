<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Servidor | Udesaken</title>
    
    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { gold: '#C6A87C', dark: '#050505' },
                        discord: { blurple: '#5865F2', hover: '#4752C4' }
                    },
                    letterSpacing: { tight: '-0.02em' }
                }
            }
        }
    </script>
</head>
<body class="antialiased selection:bg-brand-gold/30 selection:text-white">

    <div class="liquid-container">
        <div class="liquid-orb orb-1"></div>
        <div class="liquid-orb orb-2"></div>
        <div class="liquid-orb orb-3"></div>
    </div>

    <main class="min-h-screen flex items-center justify-center p-4 relative z-10">
        
        <div class="glass-panel w-full max-w-[440px] p-8 md:p-10 rounded-[32px] text-center fade-up shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            
            <div class="w-20 h-20 mx-auto rounded-3xl overflow-hidden mb-6 border border-white/10 shadow-xl bg-black flex items-center justify-center">
                <img id="server-icon" src="../uskcoroa.png" alt="Icon" class="w-full h-full object-cover transition-opacity duration-300">
            </div>

            <h1 id="server-name" class="text-2xl md:text-3xl font-bold text-main mb-4 tracking-tight">
                Carregando servidor...
            </h1>

            <div class="flex items-center justify-center gap-6 text-sm text-muted mb-8 font-semibold">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e] animate-pulse"></span>
                    <span id="online-count">-- online</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-zinc-400"></span>
                    <span id="total-count">-- membros</span>
                </div>
            </div>

            <div class="space-y-3">
                <a id="accept-btn" href="#" target="_blank" class="block w-full py-3.5 bg-discord-blurple hover:bg-discord-hover text-white font-bold rounded-xl transition-all duration-300 hover:scale-[1.02] shadow-[0_0_20px_rgba(88,101,242,0.4)] opacity-50 cursor-not-allowed">
                    Aceitar Convite
                </a>
                
                <a href="../" class="block w-full py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 text-muted hover:text-white font-semibold rounded-xl transition-all duration-300 backdrop-blur-md">
                    Voltar ao Site Inicial
                </a>
            </div>

        </div>
    </main>

    <script src="../script.js"></script>

    <script>
        // === COLOQUE SEU CÓDIGO DE CONVITE AQUI ===
        // Exemplo: se o link for discord.gg/abc123xyz, coloque apenas 'abc123xyz'
        const INVITE_CODE = 'https://discord.gg/tF5J2cMzjy'; 

        async function fetchDiscordData() {
            try {
                // Chama a API oficial do Discord
                const res = await fetch(`https://discord.com/api/v9/invites/${INVITE_CODE}?with_counts=true`);
                const data = await res.json();

                if (data.guild) {
                    // Atualiza Nome
                    document.getElementById('server-name').innerText = data.guild.name;
                    
                    // Atualiza Contadores
                    document.getElementById('online-count').innerText = `${data.approximate_presence_count} online`;
                    document.getElementById('total-count').innerText = `${data.approximate_member_count} membros`;
                    
                    // Atualiza o Ícone (se o servidor tiver um)
                    if (data.guild.icon) {
                        document.getElementById('server-icon').src = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.png?size=256`;
                    }

                    // Libera o botão de entrar
                    const btn = document.getElementById('accept-btn');
                    btn.href = `https://discord.gg/${INVITE_CODE}`;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            } catch (error) {
                console.error("Erro ao puxar dados do Discord:", error);
                document.getElementById('server-name').innerText = "Erro ao carregar";
            }
        }

        // Roda a função assim que a página abre
        fetchDiscordData();
    </script>
</body>
</html>
