<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite para Udesaken' | Discord</title>
    
    <link rel="stylesheet" href="../style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { gold: '#C6A87C', dark: '#050505' },
                        discord: { blurple: '#5865F2', hover: '#4752C4' }
                    },
                    letterSpacing: { tight: '-0.02em' }
                }
            }
        }
    </script>
</head>
<body class="antialiased selection:bg-brand-gold/30 selection:text-white">

    <div class="liquid-container">
        <div class="liquid-orb orb-1"></div>
        <div class="liquid-orb orb-2"></div>
        <div class="liquid-orb orb-3"></div>
    </div>

    <main class="min-h-screen flex items-center justify-center p-4 relative z-10">
        
        <div class="glass-panel w-full max-w-[440px] p-8 md:p-10 rounded-[32px] text-center fade-up shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            
            <div class="w-20 h-20 mx-auto rounded-3xl overflow-hidden mb-5 border border-white/10 shadow-xl">
                <img src="../uskcoroa.png" alt="Udesaken Logo" class="w-full h-full object-cover">
            </div>

            <p class="text-sm text-muted font-medium mb-2">
                'islo (isloch) convidou você para se juntar
            </p>

            <h1 class="text-2xl md:text-3xl font-bold text-main mb-4 tracking-tight">
                Udesaken' | Amizades • Conversas • Call 24/7 |
            </h1>

            <div class="flex items-center justify-center gap-6 text-sm text-muted mb-8 font-semibold">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e] animate-pulse"></span>
                    <span>13 online</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-zinc-400"></span>
                    <span>70 membros</span>
                </div>
            </div>

            <div class="space-y-3">
                <a href="https://discord.gg/tF5J2cMzjy" target="_blank" class="block w-full py-3.5 bg-discord-blurple hover:bg-discord-hover text-white font-bold rounded-xl transition-all duration-300 hover:scale-[1.02] shadow-[0_0_20px_rgba(88,101,242,0.4)]">
                    Aceitar Convite
                </a>
                
                <a href="../" class="block w-full py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 text-muted hover:text-white font-semibold rounded-xl transition-all duration-300 backdrop-blur-md">
                    Voltar ao Site Inicial
                </a>
            </div>

        </div>
    </main>

    <script src="../script.js"></script>
</body>
</html>
