<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Entrar no Servidor | Udesaken</title>
    <meta name="description" content="Junte-se ao servidor oficial da Udesaken no Discord. Comunidade, suporte e novidades.">
    <meta name="theme-color" content="#a855f7">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Udesaken | Discord Oficial">
    <meta property="og:description" content="Junte-se ao servidor oficial da Udesaken no Discord. Comunidade, suporte e novidades.">
    <meta property="og:image" content="/uskcoroa.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], syne: ['Syne', 'sans-serif'] },
                    colors: {
                        brand: { 
                            purple: '#a855f7', 
                            'purple-glow': '#c084fc',
                            dark: '#000000' 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Canvas Buraco Negro (Roxo) */
        #universe-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Glass Panel */
        .glass-panel {
            background: rgba(12, 12, 12, 0.62);
            backdrop-filter: blur(28px) saturate(130%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.85);
            transition: transform 0.35s cubic-bezier(.16,1,.3,1), border-color 0.35s ease;
        }
        
        .glass-panel:hover {
            border-color: rgba(168, 85, 247, 0.35);
            transform: translateY(-3px);
        }

        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-up.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Botão Roxo */
        .btn-purple {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }
        .btn-purple:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
            background: linear-gradient(135deg, #c084fc, #a855f7);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
            color: #fff;
        }

        ::-webkit-scrollbar { width: 5px; background: #000; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 3px; }
        ::selection { background: rgba(168,85,247,0.3); color: #fff; }
    </style>
    <link rel="icon" type="image/png" href="/uskcoroa.png">
</head>
<body>

    <canvas id="universe-canvas"></canvas>

    <main class="min-h-screen flex items-center justify-center p-4 relative z-10">
        
        <div class="glass-panel w-full max-w-[440px] p-8 md:p-10 rounded-[32px] text-center fade-up">
            
            <div class="w-20 h-20 mx-auto rounded-3xl overflow-hidden mb-6 border border-white/10 shadow-xl bg-black flex items-center justify-center">
                <img id="server-icon" src="../uskcoroa.png" alt="Icon" class="w-full h-full object-cover transition-opacity duration-300">
            </div>

            <h1 id="server-name" class="text-2xl md:text-3xl font-syne font-bold text-white mb-4 tracking-tight">
                Carregando servidor...
            </h1>

            <div class="flex items-center justify-center gap-6 text-sm text-gray-400 mb-8 font-semibold">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e] animate-pulse"></span>
                    <span id="online-count">-- online</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-gray-500"></span>
                    <span id="total-count">-- membros</span>
                </div>
            </div>

            <div class="space-y-3">
                <a id="accept-btn" href="#" target="_blank" class="block w-full py-3.5 btn-purple text-white font-bold rounded-xl transition-all duration-300 opacity-50 cursor-not-allowed">
                    <i class="fab fa-discord mr-2"></i> Aceitar Convite
                </a>
                
                <a href="../" class="block w-full py-3.5 btn-outline text-gray-300 font-semibold rounded-xl transition-all duration-300">
                    <i class="fas fa-arrow-left mr-2"></i> Voltar ao Site Inicial
                </a>
            </div>

        </div>
    </main>

    <script>
        // ==================== CANVAS BURACO NEGRO (ROXO) ====================
        (function() {
            const canvas = document.getElementById('universe-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, particles;

            const BH = {
                get x() { return W * 0.5; },
                get y() { return H * 0.82; },
                get r() { return Math.min(W, H) * 0.10; },
                diskInner: 1.5,
                diskOuter: 3.8,
                angle: 0
            };

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                particles = [];
                const n = Math.min(Math.floor(W / 20), 80);
                for (let i = 0; i < n; i++) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
                        r: Math.random() * 1 + 0.3
                    });
                }
            }

            function drawBackDisk(bx, by, R) {
                const outer = R * BH.diskOuter;
                ctx.save();
                ctx.translate(bx, by);
                const ag = ctx.createRadialGradient(0, -R*.18, R*BH.diskInner*.5, 0, 0, outer*.85);
                ag.addColorStop(0, 'rgba(168,85,247,0.45)');
                ag.addColorStop(0.4, 'rgba(140,80,240,0.25)');
                ag.addColorStop(1, 'rgba(80,30,180,0)');
                ctx.beginPath();
                ctx.ellipse(0, -R*.22, outer*.88, R*.22, 0, Math.PI, 0);
                ctx.fillStyle = ag;
                ctx.fill();
                ctx.restore();
            }

            function drawAccretionDisk(bx, by, R, angle) {
                const inner = R * BH.diskInner, outer = R * BH.diskOuter;
                ctx.save();
                ctx.translate(bx, by); ctx.rotate(angle); ctx.scale(1, 0.28);
                const g = ctx.createRadialGradient(0,0,inner,0,0,outer);
                g.addColorStop(0, 'rgba(139,92,246,0)');
                g.addColorStop(0.2, 'rgba(168,85,247,0.5)');
                g.addColorStop(0.5, 'rgba(216,180,254,0.8)');
                g.addColorStop(0.8, 'rgba(126,34,206,0.35)');
                g.addColorStop(1, 'rgba(60,20,100,0)');
                ctx.beginPath();
                ctx.arc(0,0,outer,0,Math.PI*2);
                ctx.arc(0,0,inner,Math.PI*2,0,true);
                ctx.fillStyle = g;
                ctx.fill();
                ctx.restore();
            }

            function drawBlackHole(bx, by, R) {
                const glow = ctx.createRadialGradient(bx,by,R*.6,bx,by,R*2);
                glow.addColorStop(0,'rgba(168,85,247,0.15)');
                glow.addColorStop(0.4,'rgba(100,50,200,0.08)');
                glow.addColorStop(1,'rgba(0,0,0,0)');
                ctx.beginPath(); ctx.arc(bx,by,R*2,0,Math.PI*2); ctx.fillStyle=glow; ctx.fill();
                
                const sh = ctx.createRadialGradient(bx,by*.999,R*.1,bx,by,R);
                sh.addColorStop(0,'#000'); sh.addColorStop(0.85,'#000'); sh.addColorStop(1,'rgba(0,0,0,0.85)');
                ctx.beginPath(); ctx.arc(bx,by,R,0,Math.PI*2); ctx.fillStyle=sh; ctx.fill();
            }

            function gravity(p) {
                const dx=BH.x-p.x, dy=BH.y-p.y, d=Math.hypot(dx,dy);
                if (d < BH.r*5 && d > BH.r*1.2) {
                    const f=0.0001*(BH.r*5/d);
                    p.vx+=(dx/d)*f; p.vy+=(dy/d)*f;
                }
                if (d < BH.r*1.15) {
                    p.x=Math.random()*W; p.y=Math.random()*H*.6;
                    p.vx=(Math.random()-.5)*.3; p.vy=(Math.random()-.5)*.3;
                }
            }

            let t = 0;
            function draw() {
                ctx.clearRect(0,0,W,H);
                t += 16; BH.angle = t * 0.00015;
                drawBackDisk(BH.x,BH.y,BH.r);
                drawAccretionDisk(BH.x,BH.y,BH.r,BH.angle);
                drawBlackHole(BH.x,BH.y,BH.r);
                ctx.fillStyle='rgba(230,210,255,0.6)';
                for (let i=0; i<particles.length; i++) {
                    const p=particles[i];
                    gravity(p); p.x+=p.vx; p.y+=p.vy;
                    if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
                    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
                }
                requestAnimationFrame(draw);
            }

            resize(); window.addEventListener('resize', resize); draw();
        })();

        // ==================== FETCH DISCORD DATA ====================
        const INVITE_CODE = 'tF5J2cMzjy';

        async function fetchDiscordData() {
            try {
                const res = await fetch(`https://discord.com/api/v9/invites/${INVITE_CODE}?with_counts=true`);
                const data = await res.json();

                if (data.guild) {
                    document.getElementById('server-name').innerText = data.guild.name;
                    document.getElementById('online-count').innerText = `${data.approximate_presence_count} online`;
                    document.getElementById('total-count').innerText = `${data.approximate_member_count} membros`;
                    
                    if (data.guild.icon) {
                        document.getElementById('server-icon').src = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.png?size=256`;
                    }

                    const btn = document.getElementById('accept-btn');
                    btn.href = `https://discord.gg/${INVITE_CODE}`;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            } catch (error) {
                console.error("Erro ao carregar dados do Discord:", error);
                document.getElementById('server-name').innerText = "Servidor Udesaken";
                document.getElementById('online-count').innerText = "0 online";
                document.getElementById('total-count').innerText = "0 membros";
            }
        }

        fetchDiscordData();

        // ==================== FADE-UP ANIMATION ====================
        const fadeElement = document.querySelector('.fade-up');
        if (fadeElement) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                });
            }, { threshold: 0.1 });
            observer.observe(fadeElement);
        }
    </script>
</body>
</html>
