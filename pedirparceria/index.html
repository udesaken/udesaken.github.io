<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Udesaken Group | Solicitar Parceria">
    <meta property="og:description" content="Junte-se ao ecossistema Udesaken. Solicite uma parceria oficial para o seu grupo.">
    <meta property="og:image" content="https://udesaken.site/logousk.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Parceria | Udesaken Group</title>

    <link rel="stylesheet" href="../style.css"> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { gold: '#C6A87C', dark: '#050505' }
                    },
                    letterSpacing: { tight: '-0.02em' }
                }
            }
        }
    </script>
</head>
<body class="antialiased selection:bg-brand-gold/30 selection:text-white">

    <div class="liquid-container">
        <div class="liquid-orb orb-1"></div>
        <div class="liquid-orb orb-2"></div>
        <div class="liquid-orb orb-3"></div>
    </div>

    <nav class="fixed w-full z-50 top-0 nav-liquid transition-all duration-300" id="navbar">
        <div class="max-w-[1190px] mx-auto px-6 h-20 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3 cursor-pointer group">
                <div class="w-9 h-9 rounded-lg overflow-hidden border border-white/10 bg-black group-hover:border-brand-gold/50 transition duration-500">
                     <img src="../logousk1.png" alt="Logo" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition">
                </div>
                <span class="text-lg font-bold tracking-tight text-main group-hover:text-gold transition">
                    Udesaken
                </span>
            </a>
            
            <div class="hidden md:flex items-center gap-6">
                <a href="../comandos/" class="text-sm font-semibold text-muted hover:text-main transition">Comandos</a>
                <a href="../equipe/" class="text-sm font-semibold text-muted hover:text-main transition">Equipe</a>
                <a href="../planos/" class="text-sm font-bold text-main hover:text-gold transition">Planos</a>
                
                <button id="theme-btn" class="theme-toggle" aria-label="Alternar Tema" style="padding: 8px;">
                    <i class="fas fa-moon text-sm"></i>
                </button>
            </div>

            <div class="flex items-center gap-4 md:hidden">
                <button id="theme-btn-mobile" class="theme-toggle" style="padding: 8px;">
                    <i class="fas fa-moon text-sm"></i>
                </button>
                <button id="mobile-menu-btn" class="text-main">
                    <i class="fas fa-bars text-lg"></i>
                </button>
            </div>
        </div>
    </nav>

    <section class="pt-32 pb-10 text-center relative">
        <div class="max-w-4xl mx-auto px-6 fade-up" style="animation-delay: 0.1s;">
            <div class="inline-flex items-center gap-2 mb-6 px-3 py-1.5 rounded-full glass-panel">
                <i class="fas fa-handshake text-yellow-500 text-xs"></i>
                <span class="text-[10px] font-bold text-main tracking-widest uppercase">Portal de Parcerias</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-black text-main mb-4 tracking-tighter leading-[1.1] drop-shadow-2xl">
                Fortaleça sua <br>
                <span class="text-gradient-gold">Comunidade.</span>
            </h1>
            <p class="text-lg text-muted max-w-2xl mx-auto font-medium leading-relaxed">
                Preencha os dados abaixo para analisarmos o perfil do seu grupo e oficializarmos nossa parceria.
            </p>
        </div>
    </section>

    <section class="py-10 relative mb-20">
        <div class="max-w-[700px] mx-auto px-6 fade-up" style="animation-delay: 0.3s;">
            <form id="form-parceria" class="glass-panel p-8 md:p-10 rounded-[24px] shadow-2xl space-y-8 border border-white/10">
                
                <div>
                    <h3 class="text-xl font-bold text-main mb-4 flex items-center gap-2">
                        <i class="fas fa-users text-yellow-500"></i> Informações do Grupo
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-muted mb-1">Nome do grupo</label>
                            <input type="text" required placeholder="Ex: Resenha Elite" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none transition backdrop-blur-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-muted mb-1">Link do grupo do WhatsApp</label>
                            <input type="url" required placeholder="https://chat.whatsapp.com/..." class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none transition backdrop-blur-sm">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-muted mb-1">Quantidade de membros</label>
                                <input type="number" required placeholder="Ex: 250" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none transition backdrop-blur-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-muted mb-1">Nome do dono/responsável</label>
                                <input type="text" required placeholder="Seu nome ou Nick" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none transition backdrop-blur-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-muted mb-1">Contato do responsável (WhatsApp ou Discord)</label>
                            <input type="text" required placeholder="Número com DDD ou Usuário do Discord" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none transition backdrop-blur-sm">
                        </div>
                    </div>
                </div>

                <hr class="border-white/10">

                <div>
                    <h3 class="text-xl font-bold text-main mb-4 flex items-center gap-2">
                        <i class="fas fa-chart-line text-green-500"></i> Atividade
                    </h3>
                    <label class="block text-sm font-semibold text-muted mb-3">O grupo é ativo diariamente?</label>
                    <div class="flex gap-6">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="radio" name="ativo" value="sim" class="w-4 h-4 accent-yellow-500" checked>
                            <span class="text-main group-hover:text-yellow-500 transition font-medium">Sim</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="radio" name="ativo" value="nao" class="w-4 h-4 accent-yellow-500">
                            <span class="text-main group-hover:text-yellow-500 transition font-medium">Não</span>
                        </label>
                    </div>
                </div>

                <hr class="border-white/10">

                <div>
                    <h3 class="text-xl font-bold text-main mb-4 flex items-center gap-2">
                        <i class="fas fa-crown text-yellow-500"></i> Tipo de Parceria
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <label class="cursor-pointer relative">
                            <input type="radio" name="tipo_parceria" value="basica" class="peer sr-only" checked>
                            <div class="p-5 rounded-xl border border-white/10 bg-black/20 peer-checked:border-yellow-500 peer-checked:bg-yellow-500/10 transition-all hover:bg-white/5 h-full">
                                <div class="font-bold text-main mb-1">Parceria Básica</div>
                                <div class="text-xs text-muted">Troca de links e divulgação mútua padrão.</div>
                                <div class="absolute top-4 right-4 text-yellow-500 opacity-0 peer-checked:opacity-100 transition">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </div>
                        </label>

                        <label class="cursor-pointer relative">
                            <input type="radio" name="tipo_parceria" value="oficial" class="peer sr-only">
                            <div class="p-5 rounded-xl border border-white/10 bg-black/20 peer-checked:border-yellow-500 peer-checked:bg-yellow-500/10 transition-all hover:bg-white/5 h-full relative overflow-hidden">
                                <div class="absolute -right-6 top-2 bg-yellow-600 text-[9px] font-black uppercase tracking-wider py-1 px-8 rotate-45 shadow-lg">VIP</div>
                                <div class="font-bold text-main mb-1 text-yellow-500">Parceria Oficial</div>
                                <div class="text-xs text-muted">Integração com bots Udesaken, eventos e suporte prioritário.</div>
                                <div class="absolute top-4 right-4 text-yellow-500 opacity-0 peer-checked:opacity-100 transition z-10">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full py-4 bg-yellow-600 text-white font-bold rounded-xl hover:bg-yellow-500 transition shadow-[0_0_20px_rgba(202,138,4,0.3)] hover:shadow-[0_0_30px_rgba(202,138,4,0.5)] flex items-center justify-center gap-2 mt-4">
                    Enviar Solicitação <i class="fas fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </section>

    <footer class="py-10 border-t border-white/5 bg-black/20 relative z-10 glass-panel">
        <div class="max-w-[1100px] mx-auto px-6 text-center">
            <p class="text-[10px] text-muted font-black tracking-[0.2em] uppercase">
                Udesaken Group &copy; 2026 • Todos os direitos reservados
            </p>
        </div>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
