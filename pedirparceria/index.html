<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Udesaken Group | Solicitar Parceria">
    <meta property="og:description" content="Junte-se ao ecossistema Udesaken. Solicite uma parceria oficial para o seu grupo e ganhe descontos no bot.">
    <meta property="og:image" content="https://udesaken.site/logousk.png">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Parceria | Udesaken Group</title>

    <link rel="stylesheet" href="../style.css?v=4.0"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { gold: '#C6A87C', dark: '#050505' },
                        main: 'var(--text-main)',
                        muted: 'var(--text-muted)',
                        gold: 'var(--accent)'
                    },
                    letterSpacing: { tight: '-0.02em' }
                }
            }
        }
    </script>
</head>
<body class="antialiased selection:bg-brand-gold/30 selection:text-white">

    <div class="liquid-container">
        <div class="liquid-orb orb-1"></div>
        <div class="liquid-orb orb-2"></div>
        <div class="liquid-orb orb-3"></div>
    </div>

    <nav class="fixed w-full z-50 top-0 nav-liquid transition-all duration-300" id="navbar">
        <div class="max-w-[1190px] mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 cursor-pointer group">
                <div class="w-9 h-9 rounded-lg overflow-hidden border border-white/10 bg-black group-hover:border-brand-gold/50 transition duration-500">
                     <img src="../logousk1.png" alt="Logo" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition">
                </div>
                <span class="text-lg font-bold tracking-tight text-main group-hover:text-gold transition">
                    Udesaken
                </span>
            </a>
            
            <div class="hidden md:flex items-center gap-6">
                <a href="../comandos/" class="text-sm font-semibold text-muted hover:text-main transition">Comandos</a>
                <a href="../equipe/" class="text-sm font-semibold text-muted hover:text-main transition">Equipe</a>
                <a href="../planos/" class="text-sm font-bold text-main hover:text-gold transition">Planos</a>
                
                <button id="theme-btn" class="theme-toggle" aria-label="Alternar Tema" style="padding: 8px;">
                    <i class="fas fa-moon text-sm"></i>
                </button>
            </div>

            <div class="flex items-center gap-4 md:hidden">
                <button id="theme-btn-mobile" class="theme-toggle" style="padding: 8px;">
                    <i class="fas fa-moon text-sm"></i>
                </button>
                <button id="mobile-menu-btn" class="text-main">
                    <i class="fas fa-bars text-lg"></i>
                </button>
            </div>
        </div>
    </nav>

    <section class="pt-32 pb-10 text-center relative">
        <div class="max-w-4xl mx-auto px-6 fade-up" style="animation-delay: 0.1s;">
            <div class="inline-flex items-center gap-2 mb-6 px-3 py-1.5 rounded-full glass-panel">
                <i class="fas fa-handshake text-yellow-500 text-xs"></i>
                <span class="text-[10px] font-bold text-main tracking-widest uppercase">Portal de Parcerias</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-black text-main mb-4 tracking-tighter leading-[1.1] drop-shadow-2xl">
                Cresça com a <br>
                <span class="text-gradient-gold">Udesaken.</span>
            </h1>
            <p class="text-lg text-muted max-w-2xl mx-auto font-medium leading-relaxed">
                Refine sua presença digital e integre seu grupo ao ecossistema tecnológico da Udesaken.
            </p>
        </div>
    </section>

    <section class="py-10 relative mb-20">
        <div class="max-w-[750px] mx-auto px-6 fade-up" style="animation-delay: 0.3s;">
            <form id="form-parceria" class="glass-panel p-8 md:p-10 rounded-[24px] shadow-2xl space-y-8 border border-white/10">
                
                <div>
                    <h3 class="text-xl font-bold text-main mb-6 flex items-center gap-2">
                        <i class="fas fa-users text-yellow-500"></i> Informações Estruturais
                    </h3>
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-muted uppercase tracking-wider mb-2">Nome do grupo</label>
                                <input type="text" name="nome_grupo" required placeholder="Ex: Comunidade Dev" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 outline-none transition backdrop-blur-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-muted uppercase tracking-wider mb-2">Nicho do Grupo</label>
                                <select name="nicho" required class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 outline-none transition backdrop-blur-sm appearance-none">
                                    <option value="" disabled selected>Selecione o tema</option>
                                    <option value="conversa">Conversa / Chat</option>
                                    <option value="jogos">Jogos / E-sports</option>
                                    <option value="figurinhas">Figurinhas / Memes</option>
                                    <option value="tecnologia">Tecnologia / Programação</option>
                                    <option value="outro">Outro</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-muted uppercase tracking-wider mb-2">Link do grupo (WhatsApp)</label>
                            <input type="url" name="link_grupo" required placeholder="https://chat.whatsapp.com/..." class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 outline-none transition backdrop-blur-sm">
                        </div>
                    </div>
                </div>

                <hr class="border-white/10">

                <div>
                    <h3 class="text-xl font-bold text-main mb-6 flex items-center gap-2">
                        <i class="fas fa-crown text-yellow-500"></i> Nível da Parceria
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <label class="cursor-pointer relative flex group">
                            <input type="radio" name="tipo_parceria" value="basica" class="peer sr-only" checked onchange="updateMinMembers(80)">
                            <div class="p-6 rounded-2xl border border-white/10 bg-black/20 peer-checked:border-yellow-500/50 peer-checked:bg-yellow-500/5 transition-all w-full border-t-4 border-t-transparent peer-checked:border-t-yellow-500">
                                <div class="font-black text-main mb-1 text-lg uppercase tracking-tighter">Básica</div>
                                <div class="text-[10px] text-yellow-500 font-bold mb-4">80-100 MEMBROS</div>
                                <ul class="text-[11px] text-muted space-y-2 mb-6">
                                    <li><i class="fas fa-check text-yellow-500 mr-2"></i>1 Divulgação Semanal</li>
                                    <li><i class="fas fa-check text-yellow-500 mr-2"></i>Listagem no Site</li>
                                    <li><i class="fas fa-tag text-yellow-500 mr-2"></i>R$ 1,00 de Desconto</li>
                                </ul>
                                <div class="absolute top-4 right-4 text-yellow-500 opacity-0 peer-checked:opacity-100 transition">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </div>
                        </label>

                        <label class="cursor-pointer relative flex group">
                            <input type="radio" name="tipo_parceria" value="oficial" class="peer sr-only" onchange="updateMinMembers(200)">
                            <div class="p-6 rounded-2xl border border-white/10 bg-black/20 peer-checked:border-yellow-500/50 peer-checked:bg-yellow-500/5 transition-all w-full border-t-4 border-t-transparent peer-checked:border-t-yellow-500 relative overflow-hidden">
                                <div class="absolute -right-8 top-2 bg-yellow-500 text-[8px] font-black text-black px-8 py-1 rotate-45">VIP</div>
                                <div class="font-black text-yellow-500 mb-1 text-lg uppercase tracking-tighter">Oficial</div>
                                <div class="text-[10px] text-yellow-500 font-bold mb-4">200+ MEMBROS</div>
                                <ul class="text-[11px] text-muted space-y-2 mb-6">
                                    <li><i class="fas fa-check text-yellow-500 mr-2"></i>2 Divulgações Semanais</li>
                                    <li><i class="fas fa-check text-yellow-500 mr-2"></i>Destaque no Site</li>
                                    <li><i class="fas fa-tag text-yellow-500 mr-2"></i>R$ 2,00 de Desconto</li>
                                </ul>
                                <div class="absolute top-4 right-4 text-yellow-500 opacity-0 peer-checked:opacity-100 transition z-10">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-muted uppercase tracking-wider mb-2">Qtd. de Membros Atual</label>
                        <input type="number" name="membros" id="input-membros" required min="80" placeholder="Mínimo 80" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 outline-none transition backdrop-blur-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-muted uppercase tracking-wider mb-2">Nome do Responsável</label>
                        <input type="text" name="responsavel" required placeholder="Ex: Islo" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 outline-none transition backdrop-blur-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-muted uppercase tracking-wider mb-2">Contato (WhatsApp ou Discord)</label>
                    <input type="text" name="contato" required placeholder="Número com DDD ou User#0000" class="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-3 text-main focus:border-yellow-500 outline-none transition backdrop-blur-sm">
                </div>

                <hr class="border-white/10">

                <div class="bg-black/40 border border-white/5 rounded-2xl p-6">
                    <h4 class="text-sm font-bold text-main mb-4 flex items-center gap-2 uppercase tracking-widest">
                        <i class="fas fa-clipboard-check text-yellow-500"></i> Termos de Compromisso
                    </h4>
                    <div class="space-y-3 mb-6">
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="checkbox" required class="w-4 h-4 accent-yellow-500 rounded border-white/10 bg-black/20">
                            <span class="text-xs text-muted group-hover:text-main transition">Confirmo que o link do Discord está na descrição do grupo.</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="checkbox" required class="w-4 h-4 accent-yellow-500 rounded border-white/10 bg-black/20">
                            <span class="text-xs text-muted group-hover:text-main transition">O grupo proíbe estritamente conteúdo +18 ou Apostas.</span>
                        </label>
                        <label class="flex items-center gap-3 cursor-pointer group">
                            <input type="checkbox" required class="w-4 h-4 accent-yellow-500 rounded border-white/10 bg-black/20">
                            <span class="text-xs text-muted group-hover:text-main transition">Estou ciente de que a remoção do link causa rescisão imediata.</span>
                        </label>
                    </div>

                    <button type="submit" class="w-full py-4 bg-yellow-600 hover:bg-yellow-500 text-white font-black uppercase tracking-widest text-xs rounded-xl transition-all shadow-[0_10px_20px_rgba(202,138,4,0.2)] hover:shadow-[0_15px_30px_rgba(202,138,4,0.4)] flex items-center justify-center gap-3 active:scale-[0.98]">
                        Submeter para Avaliação <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
    </section>

    <footer class="py-10 border-t border-white/5 bg-black/20 relative z-10">
        <div class="max-w-[1100px] mx-auto px-6 text-center">
            <p class="text-[10px] text-muted font-black tracking-[0.2em] uppercase">
                Udesaken Group &copy; 2026 • CEO isloch
            </p>
        </div>
    </footer>

    <script src="../script.js?v=4.0"></script>
    <script>
        // Lógica Dinâmica para os Requisitos
        function updateMinMembers(min) {
            const input = document.getElementById('input-membros');
            input.min = min;
            input.placeholder = `Mínimo ${min}`;
            
            // Feedback visual se o valor atual for menor que o novo mínimo
            if (input.value && input.value < min) {
                input.classList.add('border-red-500');
            } else {
                input.classList.remove('border-red-500');
            }
        }

        // Validação adicional antes do envio
        document.getElementById('form-parceria').addEventListener('submit', function(e) {
            const membros = parseInt(document.getElementById('input-membros').value);
            const minRequerido = parseInt(document.getElementById('input-membros').min);
            
            if (membros < minRequerido) {
                e.preventDefault();
                alert(`Para esta categoria, seu grupo precisa de no mínimo ${minRequerido} membros.`);
            }
        });
    </script>
</body>
</html>
